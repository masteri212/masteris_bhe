# Builds the mod on every push and pull request and keeps the jar as a download on the run.
# Pushing a version tag (git tag v1.0.0 && git push origin v1.0.0) also makes a GitHub release with the jar attached.
name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used to publish the release on tags
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: masteris_bhe
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish a release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
